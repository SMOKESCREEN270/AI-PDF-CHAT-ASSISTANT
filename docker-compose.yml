services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdf_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-before-shared-deployment}
      POSTGRES_DB: pdf_chat_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf_assistant} -d pdf_chat_assistant"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdf_assistant}:${POSTGRES_PASSWORD:-change-this-before-shared-deployment}@postgres:5432/pdf_chat_assistant
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-this-session-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DEFAULT_OPENROUTER_API_KEY: ${DEFAULT_OPENROUTER_API_KEY:-}
      OPENROUTER_GENERATION_MODEL: ${OPENROUTER_GENERATION_MODEL:-openai/gpt-oss-20b:free}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-liquid/lfm-2.5-embedding-350m:free}
      CHROMA_PERSIST_DIR: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI PDF Chat Assistant}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports
      - chroma_data:/app/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
  backend_exports:
  chroma_data:
